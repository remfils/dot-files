
Section "InputClass"
    Identifier "touchpad catchall"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Базовые улучшения
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"

    # Чувствительность и скорость
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0.5"

    # Отключение случайных нажатий при наборе текста
    Option "DisableWhileTyping" "on"

    # Нажатие в углу как правая кнопка (опционально)
    Option "TapButton2" "3"
    Option "TapButton3" "2"
EndSection

